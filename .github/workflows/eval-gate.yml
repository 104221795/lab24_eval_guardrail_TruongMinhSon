name: Lab 24 Eval Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate testset
        run: python phase-a/generate_testset.py
      - name: Run RAGAS evaluation gate
        run: python phase-a/run_ragas_eval.py --gate
      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ragas-evaluation-artifacts
          path: |
            phase-a/ragas_summary.json
            phase-a/ragas_results.csv
